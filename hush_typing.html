<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hush · 睡前伴侣</title>
<style>
/* ============================================================
   HUSH — Design System
   暗色、低刺激、大触控、层级清晰
   ============================================================ */
:root {
  --bg: #06050e;
  --surface: #0e0c1a;
  --card: #151226;
  --card2: #1c1832;
  --line: rgba(255,255,255,.07);
  --line2: rgba(255,255,255,.12);
  --ink: #ddd8f0;
  --soft: #a098c8;
  --muted: #6e6890;
  --purple: #9888e0;
  --purple2: #b8a8f4;
  --purpleBg: rgba(140,120,210,.15);
  --gold: #c8a860;
  --pink: #e298b0;
  --red: #f08a8a;
  --safeTop: env(safe-area-inset-top, 0px);
  --safeBottom: env(safe-area-inset-bottom, 0px);
  --navH: 64px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}

/* ---- 环境光 ---- */
.ambient {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 600px 400px at 50% 20%, rgba(120,100,210,.15) 0%, transparent 60%),
    radial-gradient(ellipse 500px 300px at 50% 75%, rgba(80,60,160,.08) 0%, transparent 55%);
  animation: ambientBreath 12s ease-in-out infinite;
}
@keyframes ambientBreath { 0%,100%{opacity:.6} 50%{opacity:1} }

/* ---- 入场遮罩 ---- */
.gate {
  position: fixed; inset: 0; z-index: 50;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; cursor: pointer;
  transition: opacity .7s, visibility .7s;
}
.gate.hide { opacity: 0; pointer-events: none; visibility: hidden; }
.gate-orb { width: 110px; height: 110px; border-radius: 50%;
  background: radial-gradient(circle at 40% 34%,#fff,#d8caf8 32%,#9078d8 64%,#3d3070 100%);
  box-shadow: 0 0 70px 14px rgba(140,120,220,.5);
  animation: orbFloat 5s ease-in-out infinite; }
@keyframes orbFloat { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-7px) scale(1.04)} }
.gate-title { font-size: 28px; font-weight: 700; letter-spacing: 8px; }
.gate-sub { font-size: 14px; color: var(--soft); letter-spacing: 2px; }

/* ---- App Shell ---- */
.app { position: relative; z-index: 1; height: 100dvh; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; }

/* ---- 顶部栏 ---- */
.topbar {
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  padding: calc(12px + var(--safeTop)) 16px 8px;
}
.topbar .t-orb { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: radial-gradient(circle at 38% 34%,#fff,#d8caf8 35%,#9880d8 72%,#483890 100%);
  box-shadow: 0 0 24px 5px rgba(130,110,210,.3);
  animation: orbFloat 6s ease-in-out infinite;
  transition: box-shadow .4s; }
.topbar .t-orb.on { box-shadow: 0 0 40px 12px rgba(170,140,240,.5); }
.topbar .t-title { font-size: 13px; color: var(--soft); letter-spacing: 2px; flex: 1; }
.topbar .t-gear { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--soft); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* ---- 内容区 ---- */
.content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; }
.content.active { display: flex; flex-direction: column; }
.content::-webkit-scrollbar { width: 0; }

/* ---- 底部导航 ---- */
.nav {
  display: flex; flex-shrink: 0;
  border-top: 1px solid var(--line);
  background: rgba(10,8,22,.92);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding-bottom: var(--safeBottom);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 10px 0 8px; cursor: pointer; transition: .15s;
  color: var(--muted); font-size: 11px; font-weight: 500;
  letter-spacing: .5px;
}
.nav-item .n-icon { font-size: 20px; transition: .2s; }
.nav-item.active { color: var(--purple2); }
.nav-item.active .n-icon { transform: translateY(-2px); }

/* ============================================================
   TAB 1: 今夜 — 陪伴聊天
   ============================================================ */
.chat-messages { flex: 1; overflow-y: auto; padding: 4px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.chat-messages::-webkit-scrollbar { width: 0; }

.msg { max-width: 86%; padding: 11px 15px; border-radius: 17px; font-size: 15px; line-height: 1.6; animation: msgIn .3s ease-out; word-break: break-word; }
@keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.msg.her { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 5px; color: var(--ink); }
.msg.me  { align-self: flex-end; background: linear-gradient(135deg, rgba(120,98,200,.30), rgba(148,118,210,.20)); border: 1px solid rgba(255,255,255,.06); border-bottom-right-radius: 5px; color: #e6e0f6; }

/* 快速操作（今夜 tab 内） */
.quick-actions { display: flex; gap: 8px; padding: 0 14px 8px; flex-shrink: 0; }
.qact {
  flex: 1; padding: 11px 8px; border-radius: 14px; text-align: center;
  font-size: 13px; font-weight: 500; cursor: pointer; transition: .15s;
  background: var(--card); border: 1px solid var(--line); color: var(--soft);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.qact:active { background: var(--purpleBg); border-color: var(--purple); color: #fff; }
.qact .qa-icon { font-size: 17px; }

/* 输入区 */
.chat-input-wrap { display: flex; gap: 6px; align-items: center; padding: 6px 12px calc(8px + var(--safeBottom)); flex-shrink: 0; }
.chat-input-wrap input {
  flex: 1; padding: 12px 16px; border-radius: 22px;
  background: var(--surface); border: 1px solid var(--line);
  color: var(--ink); font-size: 15.5px; font-family: inherit;
  outline: none; transition: .2s; }
.chat-input-wrap input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(130,110,210,.10); }
.chat-input-wrap input::placeholder { color: var(--muted); }
.chat-input-wrap .send { width: 42px; height: 42px; border-radius: 50%; border: none; flex-shrink: 0;
  background: linear-gradient(135deg, #8b78d6, #b898d8); color: #fff;
  font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* 音景条（今夜 tab 底部） */
.sound-mini {
  margin: 0 12px 6px; padding: 7px 14px; border-radius: 14px; flex-shrink: 0;
  background: rgba(20,16,38,.9); border: 1px solid var(--line);
  display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--soft);
}
.sound-mini.on { display: flex; }
.sound-mini .sm-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--purple); animation: sPulse 1.4s ease-in-out infinite; }
@keyframes sPulse { 0%,100%{opacity:.35} 50%{opacity:1} }
.sound-mini button { margin-left: auto; background: none; border: none; color: var(--soft); font-size: 15px; cursor: pointer; }

/* ============================================================
   TAB 2: 梦境 — 图像生成
   ============================================================ */
.dream-page { padding: 8px 16px 20px; gap: 14px; }
.dream-page .section-title { font-size: 13px; color: var(--muted); letter-spacing: 1px; margin-bottom: 2px; }

/* 风格 chips */
.style-chips { display: flex; gap: 7px; flex-wrap: wrap; }
.style-chip {
  padding: 7px 14px; border-radius: 16px; font-size: 12.5px; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); color: var(--soft);
  transition: .15s; white-space: nowrap;
}
.style-chip.selected { background: var(--purpleBg); border-color: var(--purple); color: var(--purple2); }

/* Prompt 输入 */
.prompt-area {
  width: 100%; min-height: 90px; padding: 14px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line);
  color: var(--ink); font-size: 15px; font-family: inherit;
  resize: vertical; outline: none; transition: .2s; line-height: 1.6;
}
.prompt-area:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(130,110,210,.10); }
.prompt-area::placeholder { color: var(--muted); }
.prompt-hint { font-size: 11.5px; color: var(--muted); text-align: right; margin-top: 2px; }

.generate-btn {
  width: 100%; padding: 14px; border-radius: 14px; border: none;
  background: linear-gradient(135deg, #8b78d6, #b070c8);
  color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  letter-spacing: 2px; transition: .2s;
}
.generate-btn:active { opacity: .8; transform: scale(.98); }
.generate-btn:disabled { opacity: .4; pointer-events: none; }

/* 生图结果 */
.dream-result { display: none; margin-top: 4px; }
.dream-result.on { display: block; }
.dream-img-wrap {
  position: relative; border-radius: 16px; overflow: hidden;
  border: 1px solid var(--line2); box-shadow: 0 0 50px 8px rgba(120,100,200,.15);
}
.dream-img-wrap img { width: 100%; display: block; aspect-ratio: 1/1; object-fit: cover; }
.dream-img-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 10px 14px; background: linear-gradient(transparent, rgba(4,4,14,.85));
  font-size: 11.5px; color: var(--soft);
}
.dream-result-actions { display: flex; gap: 8px; margin-top: 10px; }
.dream-result-actions button {
  flex: 1; padding: 11px; border-radius: 20px; border: 1px solid var(--line);
  background: rgba(255,255,255,.03); color: var(--ink);
  font-size: 13px; cursor: pointer; font-family: inherit;
}
.dream-result-actions button.primary { background: linear-gradient(135deg, #8b78d6, #b898d8); border: none; color: #fff; }

/* 生成中 */
.dream-loading {
  display: none; flex-direction: column; align-items: center; gap: 14px; padding: 30px 0;
}
.dream-loading.on { display: flex; }
.dream-loading .dl-orb {
  width: 56px; height: 56px; border-radius: 50%;
  background: radial-gradient(circle at 38% 34%,#fff,#d8caf8 35%,#9880d8 100%);
  box-shadow: 0 0 40px 8px rgba(140,120,220,.5);
  animation: orbFloat 2s ease-in-out infinite;
}
.dream-loading .dl-text { font-size: 13px; color: var(--soft); }

/* ============================================================
   TAB 3: 日记 — 归档浏览
   ============================================================ */
.journal-page { padding: 8px 16px 20px; gap: 10px; }
.journal-page .j-header { display: flex; align-items: center; justify-content: space-between; }
.journal-page .j-count { font-size: 13px; color: var(--muted); }
.j-filter { display: flex; gap: 6px; }
.j-filter .jf {
  padding: 5px 12px; border-radius: 12px; font-size: 12px; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); color: var(--soft);
  transition: .15s;
}
.j-filter .jf.active { background: var(--purpleBg); border-color: var(--purple); color: var(--purple2); }

.j-entry {
  padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line);
  cursor: pointer; transition: .15s;
}
.j-entry:active { border-color: var(--purple); }
.j-entry .je-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.j-entry .je-date { font-size: 11.5px; color: var(--muted); }
.j-entry .je-mood { font-size: 14px; }
.j-entry .je-badges { display: flex; gap: 4px; margin-left: auto; }
.j-entry .je-badge { font-size: 10.5px; padding: 2px 7px; border-radius: 8px; background: rgba(160,140,220,.15); color: var(--purple2); }
.j-entry .je-text { font-size: 14px; line-height: 1.6; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.j-empty { text-align: center; color: var(--muted); font-size: 13.5px; padding: 40px 20px; line-height: 1.8; }
.j-empty .je-icon { font-size: 40px; display: block; margin-bottom: 10px; opacity: .6; }

/* ============================================================
   TAB 4: 设置
   ============================================================ */
.settings-page { padding: 8px 16px 20px; gap: 14px; }
.setting-group { border-radius: 14px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
.setting-group .sg-title { font-size: 11px; color: var(--muted); padding: 12px 14px 6px; letter-spacing: 1px; text-transform: uppercase; }
.setting-row { display: flex; align-items: center; padding: 13px 14px; gap: 10px; border-top: 1px solid var(--line); }
.setting-row:first-child { border-top: none; }
.setting-row .sr-label { flex: 1; font-size: 14px; }
.setting-row .sr-desc { font-size: 11.5px; color: var(--muted); }
.setting-row input { flex: 1; padding: 8px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 13px; font-family: inherit; outline: none; }
.setting-row input:focus { border-color: var(--purple); }
.setting-row button {
  padding: 7px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(255,255,255,.04); color: var(--ink); font-size: 12px; cursor: pointer; font-family: inherit;
}
.api-status { font-size: 11px; padding: 3px 8px; border-radius: 8px; }
.api-status.ok { background: rgba(100,220,140,.12); color: #70d898; }
.api-status.off { background: rgba(200,160,100,.12); color: #c8a860; }

/* ============================================================
   覆盖层（二级页面）
   ============================================================ */
.overlay {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(3,3,10,.95);
  display: flex; flex-direction: column; align-items: center;
  opacity: 0; pointer-events: none; transition: opacity .35s;
  padding: calc(20px + var(--safeTop)) 20px calc(20px + var(--safeBottom));
  overflow-y: auto;
}
.overlay.on { opacity: 1; pointer-events: auto; }
.overlay .ov-close {
  position: absolute; top: calc(14px + var(--safeTop)); right: 16px;
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--line); background: rgba(255,255,255,.04);
  color: var(--ink); font-size: 16px; cursor: pointer; z-index: 2;
}
.overlay .ov-title { font-size: 16px; font-weight: 600; letter-spacing: 1px; margin-bottom: 16px; }

/* 塔罗覆盖层 */
.tarot-card { width: 100%; max-width: 280px; aspect-ratio: 3/5; perspective: 900px; }
.tarot-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.4,0,.2,1); }
.tarot-inner.flipped { transform: rotateY(180deg); }
.tarot-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 18px; text-align: center; }
.tarot-back {
  background: linear-gradient(135deg,#181040,#241d50,#1a1248);
  border: 2px solid rgba(180,155,235,.22);
  background-image:
    repeating-linear-gradient(45deg,transparent,transparent 7px,rgba(255,255,255,.015) 7px,rgba(255,255,255,.015) 8px),
    repeating-linear-gradient(-45deg,transparent,transparent 7px,rgba(255,255,255,.015) 7px,rgba(255,255,255,.015) 8px),
    radial-gradient(circle at 50% 50%,rgba(170,140,220,.10) 0%,transparent 58%);
  cursor: pointer;
}
.tarot-back-icon { font-size: 42px; opacity: .65; }
.tarot-back-text { font-size: 13px; color: var(--soft); letter-spacing: 3px; margin-top: 6px; }
.tarot-front {
  background: linear-gradient(160deg,#0d0820,#181030 40%,#0f0a26 100%);
  border: 2px solid rgba(200,175,240,.28);
  transform: rotateY(180deg); gap: 6px; overflow-y: auto;
}
.tarot-front .tf-name { font-size: 22px; font-weight: 700; color: #e6d8f8; letter-spacing: 2px; }
.tarot-front .tf-en { font-size: 11.5px; color: var(--muted); letter-spacing: 1px; }
.tarot-front .tf-sym { font-size: 40px; margin: 4px 0; }
.tarot-front .tf-kws { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin: 4px 0; }
.tarot-front .tf-kw { font-size: 10.5px; padding: 3px 8px; border-radius: 9px; background: rgba(200,175,240,.10); color: #c8b4f0; }
.tarot-front .tf-meaning { font-size: 13.5px; color: var(--soft); line-height: 1.7; margin-top: 4px; }
.tarot-front .tf-reflect { font-size: 13px; color: var(--gold); margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.08); font-style: italic; }
.tarot-actions { display: flex; gap: 8px; margin-top: 18px; width: 100%; }
.tarot-actions button {
  flex: 1; padding: 11px; border-radius: 20px; border: 1px solid var(--line);
  background: rgba(255,255,255,.04); color: var(--ink);
  font-size: 13px; cursor: pointer; font-family: inherit;
}
.tarot-actions button.primary { background: linear-gradient(135deg,#8b78d6,#b898d8); border:none; color:#fff; }

/* 日记详情覆盖层 */
.journal-detail { text-align: left; width: 100%; max-width: 400px; }
.journal-detail .jd-date { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.journal-detail .jd-text { font-size: 15px; line-height: 1.8; color: var(--ink); white-space: pre-wrap; }
.journal-detail .jd-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.journal-detail .jd-dream-img { width: 100%; border-radius: 12px; margin-top: 12px; border: 1px solid var(--line); }

/* 音景选择覆盖层 */
.sound-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 320px; }
.sound-opt {
  padding: 20px 10px; border-radius: 16px; text-align: center; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); transition: .15s;
  font-size: 14px; display: flex; flex-direction: column; gap: 6px;
}
.sound-opt:active { border-color: var(--purple); background: var(--purpleBg); }
.sound-opt .so-icon { font-size: 32px; }

/* ============================================================
   通用 components
   ============================================================ */
.empty-state { text-align: center; color: var(--muted); padding: 30px 16px; font-size: 13.5px; line-height: 1.8; }
.btn-link { background: none; border: none; color: var(--purple2); font-size: inherit; font-family: inherit; cursor: pointer; text-decoration: underline; }

@media (min-width: 520px) {
  .msg { max-width: 78%; }
}
</style>
</head>
<body>

<div class="ambient"></div>

<!-- 入场 -->
<div class="gate" id="gate">
  <div class="gate-orb"></div>
  <div class="gate-title">Hush</div>
  <div class="gate-sub">轻触屏幕，闭上眼睛打字</div>
</div>

<!-- ==================== APP SHELL ==================== -->
<div class="app" id="app">

  <!-- 顶栏 -->
  <div class="topbar">
    <div class="t-orb" id="topOrb"></div>
    <span class="t-title" id="topTitle">今夜</span>
    <button class="t-gear" id="gearBtn" title="设置">⚙</button>
  </div>

  <!-- ===== TAB 1: 今夜 ===== -->
  <div class="content active" id="tab-tonight">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="quick-actions">
      <button class="qact" data-action="tarot"><span class="qa-icon">🃏</span>抽张塔罗</button>
      <button class="qact" data-action="sound"><span class="qa-icon">🎵</span>听点声音</button>
      <button class="qact" data-action="dream"><span class="qa-icon">🌙</span>画个梦</button>
    </div>
    <div class="sound-mini" id="soundMini">
      <span class="sm-dot"></span><span id="soundMiniLabel">雨声</span>
      <button onclick="stopSound()">✕</button>
    </div>
    <div class="chat-input-wrap">
      <input type="text" id="chatInput" placeholder="说点什么…" autocomplete="off" enterkeyhint="send">
      <button class="send" id="sendBtn">↑</button>
    </div>
  </div>

  <!-- ===== TAB 2: 梦境 ===== -->
  <div class="content" id="tab-dream">
    <div class="dream-page">
      <div class="section-title">🎨 画面风格</div>
      <div class="style-chips" id="styleChips">
        <span class="style-chip selected" data-style="dreamy">🌙 梦幻</span>
        <span class="style-chip" data-style="surreal">🌀 超现实</span>
        <span class="style-chip" data-style="dark">🖤 暗黑</span>
        <span class="style-chip" data-style="warm">☀️ 温暖</span>
        <span class="style-chip" data-style="ink">🖋 水墨</span>
        <span class="style-chip" data-style="abstract">💫 抽象</span>
      </div>

      <div class="section-title" style="margin-top:16px;">💬 描述你想要的画面</div>
      <textarea class="prompt-area" id="promptInput"
        placeholder="比如：一个安静的湖面，月光洒在水上，远处有山影，萤火虫在芦苇间飞舞…"
        maxlength="600"></textarea>
      <div class="prompt-hint"><span id="promptCount">0</span>/600</div>

      <button class="generate-btn" id="generateBtn">🌙 生成梦境</button>

      <div class="dream-loading" id="dreamLoading">
        <div class="dl-orb"></div>
        <div class="dl-text">正在绘制你的梦境…</div>
      </div>

      <div class="dream-result" id="dreamResult">
        <div class="dream-img-wrap">
          <img id="dreamImage" src="" alt="梦境画面">
          <div class="dream-img-overlay" id="dreamPromptDisplay"></div>
        </div>
        <div class="dream-result-actions">
          <button onclick="closeDreamResult()">收起来</button>

  const titles = { tonight: '今夜', dream: '梦境', journal: '日记', settings: '设置' };
  $('topTitle').textContent = titles[tab] || 'Hush';

  if (tab === 'journal') renderJournal();
  if (tab === 'settings') loadApiSettings();

function classify(text) {
  const t = text.replace(/\s/g, '');
  if (/塔罗|抽牌|牌面|占卜/.test(t)) return 'tarot';
  if (/画|梦|生成|图|梦境|入梦|梦见/.test(t)) return 'dream';
  if (/听|雨|心跳|白噪|噪音|风|音景|asmr|音乐|放点|播放/i.test(t)) return 'sound';
  if (/烦|累|焦虑|emo|难过|压力|哭|崩溃|孤独|睡不着|失眠/.test(t)) return 'vent';
  return 'chat';
}

function detectMood(text) {
  const t = text.replace(/\s/g, '');
  if (/崩溃|受不了|撑不|好想哭|绝望/.test(t)) return { mood: 'heavy', emoji: '😢' };
  if (/烦|焦虑|emo|压力|难过|哭|孤独/.test(t)) return { mood: 'down', emoji: '😔' };
  if (/累|困|乏|疲|撑不住/.test(t)) return { mood: 'tired', emoji: '😴' };
  if (/开心|高兴|好棒|幸福|感恩|喜欢/.test(t)) return { mood: 'good', emoji: '🌙' };
  return { mood: 'neutral', emoji: '✨' };
}

function herReply(text, intent, mood) {
  if (intent === 'tarot') return '闭上眼睛，为你抽一张牌…';
  if (intent === 'dream') return '让我把你的思绪，画成一幅梦境…';
  if (intent === 'sound') return '好，选一种声音陪你入睡。';
  if (mood.mood === 'heavy') return '我在听。不管今天多沉重，先放在这里吧——你不必一个人扛着。';
  if (mood.mood === 'down') return '嗯，听到了。今天心里堆了不少事，先松一松。';
  if (mood.mood === 'tired') return '辛苦了。什么都不用想，让自己沉进这个安静的夜里。';
  if (mood.mood === 'good') return '真好。把这些温柔存下来，醒来也能记得。';
  return '嗯，我在。想说多少说多少，不想说了就闭上眼睛。';
}

function handleChat(text) {
  if (!text.trim()) return;
  const intent = classify(text);
  const mood = detectMood(text);

  addChatMsg('me', text);
  saveJournal({ type: 'chat', text, mood: mood.mood, emoji: mood.emoji });

    addChatMsg('her', herReply(text, intent, mood));

    else if (intent === 'dream') {
      setTimeout(() => {
        switchTab('dream');

    else if (intent === 'vent') {

      }, 1200);
    }
  }, 300 + Math.random() * 400);
}

// 发送
function sendChat() {
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  handleChat(text);
}
chatInput.addEventListener('keydown', e => {

let AC = null, masterGain = null, synthNodes = [], soundTag = null;

function getAudio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = 0.5;
    masterGain.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function stopSynth() {
  synthNodes.forEach(n => { try { n.stop && n.stop(); n.disconnect && n.disconnect(); } catch(e){} });
  synthNodes = []; soundTag = null;
}

function noiseBuf(type) {
  const ac = getAudio();
  const len = ac.sampleRate * 3, buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0); let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    if (type === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
    else if (type === 'pink') { last = 0.98 * last + 0.02 * w; d[i] = w * 0.4 + last * 0.6; }
    else d[i] = w;
  }
  return buf;
}

function playSound(kind) {
  stopSynth(); STATE.currentSound = kind; soundTag = kind;
  const ac = getAudio();

  if (kind === 'heart') {
    const g = ac.createGain(); g.gain.value = 0; g.connect(masterGain);
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = 58;
    o.connect(g); o.start(); synthNodes.push(o, g);
    const beat = () => {
      if (soundTag !== 'heart') return;
      [ac.currentTime, ac.currentTime + 0.32].forEach(t => {
        g.gain.cancelScheduledValues(t);
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(0.9, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      });
      setTimeout(beat, 1050);
    };
    beat();
  } else {
    const src = ac.createBufferSource();
    src.buffer = noiseBuf(kind === 'rain' ? 'pink' : (kind === 'wind' ? 'brown' : 'white'));
    src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.value = kind === 'rain' ? 1600 : (kind === 'wind' ? 420 : 8000);
    const g = ac.createGain(); g.gain.value = kind === 'white' ? 0.22 : 0.45;
    src.connect(lp); lp.connect(g); g.connect(masterGain);
    src.start(); synthNodes.push(src, lp, g);
    if (kind === 'rain') {
      const lfo = ac.createOscillator(); lfo.frequency.value = 0.1;
      const la = ac.createGain(); la.gain.value = 600;
      lfo.connect(la); la.connect(lp.frequency);
      lfo.start(); synthNodes.push(lfo, la);
    }
  }

  const labels = { rain: '雨声', heart: '心跳', wind: '风声', white: '白噪音' };
  $('soundMiniLabel').textContent = labels[kind] || kind;
  $('soundMini').classList.add('on');
  $('topOrb').classList.add('on');
}

function stopSound() {
  stopSynth(); STATE.currentSound = null;
  $('soundMini').classList.remove('on');
  $('topOrb').classList.remove('on');
}

function openSoundPicker() { $('soundOverlay').classList.add('on'); }
function closeSoundPicker() { $('soundOverlay').classList.remove('on'); }

$('soundOverlay').addEventListener('click', e => {

    addChatMsg('her', `在播${labels[kind]}了。想换就说「换一个」或「停下」。`);
  }
});

// 风格 prompt 修饰
const STYLE_MODIFIERS = {

  surreal: 'surreal dreamscape, Salvador Dali inspired, floating objects, impossible geometry, mind-bending, mysterious',

// 生图
generateBtn.addEventListener('click', async () => {
  const rawPrompt = promptInput.value.trim();
  if (!rawPrompt) return;

  const fullPrompt = `${rawPrompt} — ${STYLE_MODIFIERS[STATE.dreamStyle] || STYLE_MODIFIERS.dreamy}`;
  STATE.lastDreamPrompt = fullPrompt;

  // 显示加载
  $('dreamResult').classList.remove('on');
  $('dreamLoading').classList.add('on');
  generateBtn.disabled = true;

  try {
    const imageUrl = await generateImage(fullPrompt);
    $('dreamImage').src = imageUrl;
    $('dreamPromptDisplay').textContent = '🌙 ' + rawPrompt.slice(0, 80);
    $('dreamLoading').classList.remove('on');
    $('dreamResult').classList.add('on');
    STATE.lastDreamImage = imageUrl;
  } catch (err) {
    $('dreamLoading').classList.remove('on');
    // 降级：显示提示词
    $('dreamPromptDisplay').textContent = '⚠️ 生图失败 · 提示词：' + rawPrompt.slice(0, 60);
    $('dreamResult').classList.add('on');
    // 用占位图
    $('dreamImage').src = generatePlaceholderImage(fullPrompt);
    console.error('生图失败:', err);
  } finally {
    generateBtn.disabled = false;
  }
});

async function generateImage(prompt) {
  const endpoint = localStorage.getItem('hush_api_endpoint') || '/api/generate-image';
  const apiKey = localStorage.getItem('hush_api_key') || '';

  // 如果没有配置 API，直接抛错让降级逻辑处理
  if (!apiKey && endpoint === '/api/generate-image') {
    // 尝试调本地后端
  }

  const res = await fetch(endpoint, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(apiKey ? { 'Authorization': `Bearer ${apiKey}` } : {}),
    },
    body: JSON.stringify({
      prompt,
      style: STATE.dreamStyle,
      size: '1024x1024',
    }),
  });

  if (!res.ok) throw new Error(`API error: ${res.status}`);

  const data = await res.json();
  // 兼容多种返回格式
  return data.url || data.image_url || data.data?.[0]?.url || data.output || '';
}

// 占位图（Canvas 生成艺术，API 不可用时的降级）
function generatePlaceholderImage(prompt) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const hash = simpleHash(prompt);

  // 背景
  const bgGrad = ctx.createRadialGradient(220, 180, 0, 256, 280, 400);
  bgGrad.addColorStop(0, `hsl(${hash%360}, 40%, 25%)`);
  bgGrad.addColorStop(0.6, `hsl(${(hash+30)%360}, 30%, 12%)`);
  bgGrad.addColorStop(1, '#06050e');
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, 512, 512);

  // 光球
  const rng = mulberry32(hash);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const x = 80 + rng() * 352, y = 60 + rng() * 392;
    const r = 30 + rng() * 90;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const hue = (hash + i * 50) % 360;
    g.addColorStop(0, `hsla(${hue}, 60%, 70%, 0.5)`);
    g.addColorStop(0.6, `hsla(${hue}, 50%, 40%, 0.1)`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  // 粒子
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 120; i++) {
    const x = rng() * 512, y = rng() * 512;
    ctx.beginPath(); ctx.arc(x, y, rng() * 2.5 + 0.3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,180,230,${rng() * 0.5 + 0.2})`;
    ctx.fill();
  }

  return canvas.toDataURL();
}

function simpleHash(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; } return Math.abs(h); }
function mulberry32(a) { return function() { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function closeDreamResult() { $('dreamResult').classList.remove('on'); }

function saveDreamToJournal() {
  saveJournal({
    type: 'dream',
    text: '梦境：' + STATE.lastDreamPrompt.slice(0, 300),
    mood: 'neutral', emoji: '🌙',
    dreamPrompt: STATE.lastDreamPrompt,
    dreamImage: STATE.lastDreamImage,
  });
  $('dreamResult').classList.remove('on');
  if (STATE.tab === 'dream') {
    // 轻提示
    promptInput.value = '';
    promptCount.textContent = '0';
  }
  alert('已存到日记 🌙');
}

// ============================================================
// 6. 日记系统（localStorage）
// ============================================================
const JOURNAL_KEY = 'hush_journal_v3';

function loadJournal() {
  try { return JSON.parse(localStorage.getItem(JOURNAL_KEY)) || []; }
  catch (e) { return []; }
}

function saveJournal(entry) {
  const journal = loadJournal();
  journal.unshift({ id: Date.now(), date: new Date().toISOString().split('T')[0], time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), ...entry });
  if (journal.length > 300) journal.length = 300;
  localStorage.setItem(JOURNAL_KEY, JSON.stringify(journal));
}

function renderJournal(filter = 'all') {
  const journal = loadJournal();
  const list = $('journalList');
  $('journalCount').textContent = `共 ${journal.length} 条记录`;

  let filtered = filter === 'all' ? journal : journal.filter(e => e.type === filter);

  if (!filtered.length) {
    list.innerHTML = '<div class="j-empty"><span class="je-icon">📖</span>还没有日记<br>在「今夜」聊天或「梦境」生图，会自动存档</div>';
    return;
  }

  list.innerHTML = filtered.map((e, i) => {
    const badges = [];
    if (e.type === 'dream') badges.push('🌙 梦境');
    if (e.type === 'tarot') badges.push('🃏 塔罗');
    return `
      <div class="j-entry" data-index="${journal.indexOf(e)}">
        <div class="je-head">
          <span class="je-date">${e.date} ${e.time}</span>
          <span class="je-mood">${e.emoji || '✨'}</span>
          ${badges.map(b => `<span class="je-badge">${b}</span>`).join('')}
        </div>
        <div class="je-text">${escHtml(e.text.slice(0, 150))}</div>
      </div>
    `;
  }).join('');

  // 点击打开详情
  list.querySelectorAll('.j-entry').forEach(el => {
    el.addEventListener('click', () => {
      const entry = journal[parseInt(el.dataset.index)];
      openJournalDetail(entry);
    });
  });
}

function openJournalDetail(entry) {
  const content = $('journalDetailContent');
  content.innerHTML = `
    <div class="jd-date">${entry.date} ${entry.time} ${entry.emoji || ''}</div>
    <div class="jd-text">${escHtml(entry.text)}</div>
    ${entry.dreamImage ? `<img class="jd-dream-img" src="${entry.dreamImage}" alt="梦境" loading="lazy">` : ''}
    <div class="jd-meta">
      ${entry.type === 'dream' ? '<span style="font-size:11px;color:var(--muted);">🌙 梦境生图</span>' : ''}
      ${entry.type === 'tarot' ? '<span style="font-size:11px;color:var(--muted);">🃏 塔罗牌</span>' : ''}
      ${entry.mood ? `<span style="font-size:11px;color:var(--muted);">情绪：${entry.mood}</span>` : ''}
    </div>
  `;
  $('journalDetailOverlay').classList.add('on');
}

function closeJournalDetail() { $('journalDetailOverlay').classList.remove('on'); }

// 日记筛选
$('journalFilter').addEventListener('click', e => {
  const f = e.target.closest('.jf');
  if (!f) return;
  document.querySelectorAll('#journalFilter .jf').forEach(x => x.classList.remove('active'));
  f.classList.add('active');
  renderJournal(f.dataset.filter);
});

function loadApiSettings() {
  $('apiEndpoint').value = localStorage.getItem('hush_api_endpoint') || 'http://localhost:8000/api/generate-image';
  $('apiKeyInput').value = localStorage.getItem('hush_api_key') || '';

}

function saveApiKey() {
  const endpoint = $('apiEndpoint').value.trim();
  const key = $('apiKeyInput').value.trim();
  if (endpoint) localStorage.setItem('hush_api_endpoint', endpoint);
  if (key) localStorage.setItem('hush_api_key', key);
  else localStorage.removeItem('hush_api_key');
  updateApiStatus();
}

function updateApiStatus() {
  const key = localStorage.getItem('hush_api_key');
  const status = $('apiStatus');
  if (key) { status.textContent = '已配置'; status.className = 'api-status ok'; }
  else { status.textContent = '未配置'; status.className = 'api-status off'; }
}

function clearAllJournals() {
  if (confirm('确定要清除所有日记吗？此操作不可恢复。')) {
    localStorage.removeItem(JOURNAL_KEY);
    renderJournal();
  }
}

// 聊天中识别音景控制指令
const origHandleChat = handleChat;
handleChat = function(text) {
  const t = text.replace(/\s/g, '');
  if (STATE.currentSound && /停下|停|安静|别放|关了|停止/.test(t)) {
    addChatMsg('me', text); stopSound();
    addChatMsg('her', '好，安静下来了。');
    saveJournal({ type: 'chat', text, mood: 'neutral', emoji: '✨' });
    return;
  }
  if (STATE.currentSound && /换|别的|其他|另一个/.test(t)) {
    addChatMsg('me', text);
    const kinds = ['rain', 'heart', 'wind', 'white'];
    const next = kinds[(kinds.indexOf(STATE.currentSound) + 1) % kinds.length];
    playSound(next);
    const labels = { rain: '雨声', heart: '心跳', wind: '风声', white: '白噪音' };
    addChatMsg('her', `换成了${labels[next]}。`);
    saveJournal({ type: 'chat', text, mood: 'neutral', emoji: '🎵' });
    return;
  }
  origHandleChat(text);
};
