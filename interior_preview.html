<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hush · Night & Morning</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#171512;color:#f2e6cf;font-family:system-ui}body{display:grid;place-items:center}.phone{width:min(100vw,440px);height:100dvh;max-height:960px;position:relative;overflow:hidden}.view{position:absolute;inset:0;background:center/cover no-repeat}.view canvas{width:100%;height:100%;display:block;touch-action:none}#night-preview{background-image:url(assets/models/interior-night-preview.png)}#day-preview{background-image:url(assets/models/interior-day-preview.png);display:none}.caption{position:absolute;bottom:0;left:0;right:0;padding:90px 24px 30px;background:linear-gradient(transparent,#110c09dd);text-align:center;pointer-events:none}.tag{font-size:10px;letter-spacing:2px;color:#e8c591}h1{font:600 24px Georgia;margin:10px 0}p{font-size:12px;opacity:.8;line-height:1.5}.switch{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10;white-space:nowrap}.switch button{border:1px solid #f1d2a655;background:#211912bb;color:#e7cfb1;padding:9px 13px;border-radius:20px;font-size:11px;cursor:pointer}.switch button[aria-pressed=true]{background:#e6c791;color:#342516}.app-link{color:#e7cfb1;display:block;margin-top:14px;font-size:11px;pointer-events:auto}
</style><div class="phone"><section class="view" id="night-preview" data-preview="true"><canvas id="interior3d" aria-label="Night: blue window light and warm candlelight"></canvas><div class="caption"><div class="tag">STEP INSIDE · NIGHT</div><h1>Your host is waiting.</h1><p>A candlelit room before your conversation with Fox.</p><a class="app-link" href="hush_app.html?v=journey-2">Open the full journey ↗</a></div></section><section class="view" id="day-preview"><canvas id="dayroom3d" aria-label="Morning: sunlit room for revisiting a completed night"></canvas><div class="caption"><div class="tag">AFTER YOU WAKE · MORNING</div><h1>What the night kept.</h1><p>In the app, the objects open your saved diary, letters and tarot reading.</p><a class="app-link" href="hush_app.html?v=journey-2">Open the full journey ↗</a></div></section><nav class="switch" aria-label="Preview lighting versions"><button aria-pressed="true" onclick="previewPhase('night',this)">Night entry</button><button aria-pressed="false" onclick="previewPhase('day',this)">Morning room</button></nav></div><script>
function previewPhase(phase,button){for(const p of ['day','night']){const el=document.getElementById(p+'-preview');el.style.display=p===phase?'block':'none';el.dataset.preview=String(p===phase)}document.querySelectorAll('.switch button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}
</script><script type="module" src="hush_interior_3d.js?v=journey-2"></script><script type="module" src="hush_day_interior_3d.js?v=journey-2"></script></html>
